<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Society Member Statement</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .search-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .search-tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: #f0f0f0;
            color: #666;
        }
        .tab-btn:hover { background: #e0e0e0; }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .search-input-group { display: flex; gap: 15px; flex-wrap: wrap; }
        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        .search-input:focus { outline: none; border-color: #667eea; }
        .search-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .results-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }
        .results-card.show { display: block; }
        
        .property-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .property-tab {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
        }
        .property-tab:hover { background: #f0f0ff; }
        .property-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        .property-content { display: none; }
        .property-content.active { display: block; }
        
        .member-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 0.8rem; color: #888; margin-bottom: 3px; }
        .info-value { font-size: 1rem; font-weight: 600; color: #333; }
        .info-value.masked { color: #666; letter-spacing: 1px; }
        
        .proxy-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .proxy-info h4 { color: #856404; margin-bottom: 10px; }
        .proxy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .summary-card { padding: 15px; border-radius: 15px; text-align: center; }
        .summary-card.total { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .summary-card.paid { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .summary-card.outstanding { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color: white; }
        .summary-card.advance { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .summary-amount { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .summary-label { font-size: 0.85rem; opacity: 0.9; }
        
        .payment-comment {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        .comment-excellent {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .comment-improve {
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            color: white;
        }
        .comment-pay {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .section-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .table-container { overflow-x: auto; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
        }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9fa; }
        .status-paid { color: #11998e; font-weight: 600; }
        .status-unpaid { color: #eb3349; font-weight: 600; }
        .status-partial { color: #f5a623; font-weight: 600; }
        .amount-positive { color: #11998e; }
        .amount-negative { color: #eb3349; }
        .bill-period { 
            background: #e8f4fd; 
            color: #1976d2; 
            padding: 3px 8px; 
            border-radius: 5px; 
            font-size: 0.85rem;
            font-weight: 600;
        }
        .no-results { text-align: center; padding: 50px; color: #888; background: white; border-radius: 20px; }
        .print-btn {
            padding: 12px 30px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 20px;
        }
        .print-btn:hover { background: #555; }
        .pii-notice {
            font-size: 0.75rem;
            color: #999;
            margin-top: 10px;
            font-style: italic;
        }
        .search-scope {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
        }
        @media print {
            body { background: white; padding: 0; }
            .search-card, .tab-btn, .search-btn, .print-btn, .property-tabs { display: none; }
            .results-card { box-shadow: none; display: block !important; }
            .property-content { display: block !important; page-break-after: always; }
        }
        .loading { display: none; text-align: center; padding: 30px; background: white; border-radius: 20px; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

            (member.invoices || []).forEach(inv => {
                const statusClass = (inv.status || '').includes('Paid') ? 'status-paid' : 
                                   (inv.status || '').includes('Partial') ? 'status-partial' : 'status-unpaid';
                html += '<tr>';
                html += '<td>' + (inv.billId || '') + '</td>';
                html += '<td>' + (inv.period || '') + '</td>';
                html += '<td>' + (inv.billDate || '') + '</td>';
                html += '<td>₹' + (inv.billAmount || 0).toLocaleString('en-IN') + '</td>';
                html += '<td class="amount-positive">₹' + (inv.paidAmount || 0).toLocaleString('en-IN') + '</td>';
                html += '<td class="' + ((inv.balance || 0) > 0 ? 'amount-negative' : '') + '">₹' + (inv.balance || 0).toLocaleString('en-IN') + '</td>';
                html += '<td class="' + statusClass + '">' + (inv.status || '') + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            
            // Payment History with Bill Period column
            html += '<h3 class="section-title">💰 Payment History</h3>';
            html += '<div class="table-container"><table><thead><tr>';
            html += '<th>Date</th><th>Receipt No</th><th>Category</th><th>Bill Period</th><th>Description</th><th>Amount</th><th>Mode</th>';
            html += '</tr></thead><tbody>';
            
            (member.payments || []).forEach(pay => {
                const isRegular = (pay.category || '').includes('Regular') || (pay.category || '').includes('Maintenance');
                const periodDisplay = isRegular && pay.billPeriod ? 
                    '<span class="bill-period">📅 ' + pay.billPeriod + '</span>' : '-';
                
                html += '<tr>';
                html += '<td>' + (pay.date || '') + '</td>';
                html += '<td>' + (pay.receiptNo || '') + '</td>';
                html += '<td>' + (pay.category || '') + '</td>';
                html += '<td>' + periodDisplay + '</td>';
                html += '<td>' + (pay.description || '') + '</td>';
                html += '<td class="amount-positive">₹' + (pay.amount || 0).toLocaleString('en-IN') + '</td>';
                html += '<td>' + (pay.mode || '') + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            
            return html;
        }
        
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchMember(); });
    </script>
</body>
</html>
